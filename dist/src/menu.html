    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

    // --- Web Audio Synthesizer (Zero-delay Chimes) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const playSound = {
      kitchenChime: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc1.start(now); osc1.stop(now + 0.8);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(830.61, now + 0.2);
          gain2.gain.setValueAtTime(0.35, now + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(now + 0.2); osc2.stop(now + 1.2);
        } catch(e) {}
      },
      waiterAlert: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [0, 0.15, 0.3].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880 + idx * 110, now + delay);
            gain.gain.setValueAtTime(0.2, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + delay); osc.stop(now + delay + 0.3);
          });
        } catch(e) {}
      },
      orderSuccess: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (i * 0.08));
            gain.gain.setValueAtTime(0.25, now + (i * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.6);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + (i * 0.08)); osc.stop(now + (i * 0.08) + 0.6);
          });
        } catch(e) {}
      }
    };

      // Cocktails & Wine
      {
        id: "au-10",
        categoryId: "cocktails",
        name: "Salted Caramel Espresso Martini",
        description: "Vodka, fresh cold drip espresso, Kahlúa coffee liqueur, house salted caramel & cacao dust.",
        price: 20.00,
        image: "https://images.unsplash.com/photo-1545438102-799c3991ffb2?auto=format&fit=crop&w=800&q=80",
        station: "bar",
        isAvailable: true,

      },

      // Desserts
      {

        categoryId: "desserts",
        name: "Warm Sticky Date Pudding",
        description: "House-made rich date sponge, warm butterscotch sauce, vanilla bean ice cream & candied walnuts.",
        price: 14.00,
        image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=800&q=80",
        station: "kitchen",
        isAvailable: true,

        isVegan: false,
        options: [],
        extras: [{ id: "ex-icecream", name: "Extra Scoop Vanilla Ice Cream", price: 3.00 }]
      }
    ];

    const INITIAL_TABLES_AU = [
      { id: "1", number: 1, name: "Table 1 (Garden View)", area: "Front Beer Garden", seats: 4 },
      { id: "2", number: 2, name: "Table 2 (Sun Patio)", area: "Front Beer Garden", seats: 6 },
      { id: "3", number: 3, name: "Table 3 (Central)", area: "Main Bistro Hall", seats: 4 },
      { id: "4", number: 4, name: "Table 4 (Booth)", area: "Main Bistro Hall", seats: 4 },
      { id: "5", number: 5, name: "Table 5 (Lounge)", area: "Mezzanine Lounge", seats: 8 },
      { id: "6", number: 6, name: "Bar Stool 6", area: "Public Bar Counter", seats: 2 }
    ];

    const INITIAL_ORDERS_AU = [];

    // --- OrderContext State for Australia ---
    const OrderContextAU = createContext(null);

    function OrderProviderAU({ children }) {
      const venueId = useMemo(() => {
        try {
          const p = new URLSearchParams(window.location.search);
          const v = p.get('venue');
          if (v && v.trim()) {
            return v.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
          }
        } catch(e) {}
        return 'demo'; // Default Demo venue
      }, []);

      const getStored = (key, fallback) => {
        try {
          const raw = localStorage.getItem(`smart_qr_${venueId}_${key}`);
          if (raw) return JSON.parse(raw);
        } catch(e) {}
        return fallback;
      };

      const setStored = (key, val) => {
        try {
          localStorage.setItem(`smart_qr_${venueId}_${key}`, JSON.stringify(val));
        } catch(e) {}
      };

      const initialVenueRestaurant = useMemo(() => {
        if (venueId === 'demo' || venueId === 'default' || venueId === 'the-beaufort') {
          return INITIAL_RESTAURANT_AU;
        }
        const formattedName = venueId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        return {
          id: venueId,
          name: formattedName,
          subtitle: "Artisan Australian Dining & Craft Bar",
          abn: "98 765 432 109",
          address: "Shop 1, 100 Main Street, Sydney NSW 2000",
          cardSurchargeRate: 0.015,
          sundaySurchargeRate: 0.10,
          isSundayActive: true,
          wifiName: `${formattedName}-Guest`,
          wifiPassword: "SmartMenu2026",
          stripeAccountId: `acct_${venueId}`,
          stripeDashboardUrl: "https://dashboard.stripe.com/"
        };
      }, [venueId]);

      const [restaurant, setRestaurantState] = useState(() => getStored('restaurant', initialVenueRestaurant));
      const [categories, setCategoriesState] = useState(() => getStored('categories', INITIAL_CATEGORIES_AU));
      const [items, setItemsState] = useState(() => getStored('items', INITIAL_ITEMS_AU));
      const [tables, setTablesState] = useState(() => getStored('tables', INITIAL_TABLES_AU));
      const [orders, setOrdersState] = useState(() => getStored('orders', []));
      const [serviceCalls, setServiceCallsState] = useState(() => getStored('calls', []));

      const setRestaurant = (updater) => {
        setRestaurantState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          setStored('restaurant', next);
          return next;
        });
      };

      const setItems = (updater) => {
        setItemsState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          setStored('items', next);
          return next;
        });
      };

      const setTables = (updater) => {
        setTablesState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          setStored('tables', next);
          return next;
        });
      };

      const setOrders = (updater) => {
        setOrdersState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          setStored('orders', next);
          return next;
        });
      };

      const setServiceCalls = (updater) => {
        setServiceCallsState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          setStored('calls', next);
          return next;
        });
      };

      const [activeTable, setActiveTableState] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        const urlTable = p.get('table');
        if (urlTable) {
          const parsed = parseInt(urlTable, 10);
          const val = isNaN(parsed) ? urlTable : parsed;
          try { localStorage.setItem(`smart_qr_${venueId}_active_table`, String(val)); } catch(e) {}
          return val;
        }
        try {
          const stored = localStorage.getItem(`smart_qr_${venueId}_active_table`);
          if (stored) {
            const parsed = parseInt(stored, 10);
            return isNaN(parsed) ? stored : parsed;
          }
        } catch(e) {}
        return 1;
      });

      const setActiveTable = (tbl) => {
        setActiveTableState(tbl);
        try {
          localStorage.setItem(`smart_qr_${venueId}_active_table`, String(tbl));
        } catch(e) {}
      };
      const [orderType, setOrderType] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('mode') === 'takeaway' || p.get('type') === 'takeaway' ? 'takeaway' : 'dine_in';
      });
      const [takeawayTime, setTakeawayTime] = useState('As soon as possible (~15-20 min)');
      const [customerName, setCustomerName] = useState('');
      const [cart, setCart] = useState([]);
      const [activeOrderId, setActiveOrderId] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      // Visual Theme (Light Day Cafe vs Dark Night Lounge)
      const [theme, setThemeState] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        const urlTheme = p.get('theme');
        if (urlTheme === 'light' || urlTheme === 'dark') return urlTheme;
        try {
          const stored = localStorage.getItem('smart_qr_theme_au');
          if (stored === 'light' || stored === 'dark') return stored;
        } catch(e) {}
        return 'light'; // Default to pristine light theme
      });

      const setTheme = (t) => {
        const val = t === 'dark' ? 'dark' : 'light';
        setThemeState(val);
        try { localStorage.setItem('smart_qr_theme_au', val); } catch(e) {}
        if (channel) channel.postMessage({ type: 'THEME', payload: val });
      };
      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next);
        showToast(next === 'light' ? '☀️ Light Day Theme active' : '🌙 Dark Theme active');
      };

      const channel = useMemo(() => typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(`smart_qr_sync_${venueId}`) : null, [venueId]);
      const clientId = useMemo(() => `sm_${Math.random().toString(36).substr(2, 9)}`, []);

      const broadcastEvent = useCallback((type, payload) => {
        if (channel) {
          channel.postMessage({ type, payload });
        }
        if (window.__SM_MQTT_CLIENT__ && window.__SM_MQTT_CLIENT__.connected) {
          try {
            window.__SM_MQTT_CLIENT__.publish(window.__SM_MQTT_TOPIC__, JSON.stringify({
              type,
              payload,
              senderId: clientId
            }), { qos: 1 });
          } catch (e) {}
        }
      }, [channel, clientId]);

      useEffect(() => {
        if (!channel) return;
        const handler = (e) => {
          const { type, payload } = e.data || {};
          if (type === 'NEW_ORDER') { setOrders(p => [payload, ...p]); playSound.kitchenChime(); }
          else if (type === 'ORDER_APPROVED') { setOrders(p => p.map(o => o.id === payload.id ? payload : o)); playSound.kitchenChime(); }
          else if (type === 'STATUS') { setOrders(p => p.map(o => o.id === payload.id ? payload : o)); }
          else if (type === 'CLEAR_ORDERS') { setOrders([]); setActiveOrderId(null); }
          else if (type === 'CALL') { setServiceCalls(p => [payload, ...p]); playSound.waiterAlert(); }
          else if (type === 'RESOLVE') { setServiceCalls(p => p.map(c => c.id === payload.id ? payload : c)); }
          else if (type === 'ITEMS') { setItems(payload); }
          else if (type === 'TABLES') { setTables(payload); }
          else if (type === 'THEME') { setThemeState(payload); }
          else if (type === 'RESET_DEMO') { setOrders([]); }
        };
        channel.addEventListener('message', handler);
        return () => channel.removeEventListener('message', handler);
      }, [channel]);

      // Cross-Device Real-Time Cloud Synchronization (Phone <-> Mac/PC KDS)
      useEffect(() => {
        if (typeof mqtt === 'undefined') return;
        const topic = `smartmenu_au_cloud_${venueId}`;
        window.__SM_MQTT_TOPIC__ = topic;
        let client = null;

        try {
          client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            clientId: `c_${clientId}`,
            clean: true,
            reconnectPeriod: 2500
          });

          client.on('connect', () => {
            client.subscribe(topic, { qos: 1 });
          });

          client.on('message', (t, msg) => {
            if (t !== topic) return;
            try {
              const data = JSON.parse(msg.toString());
              if (!data || data.senderId === clientId) return;
              const { type, payload } = data;

              if (type === 'NEW_ORDER') {
                setOrders(p => {
                  if (p.some(o => o.id === payload.id)) return p;
                  return [payload, ...p];
                });
                if (typeof playSound !== 'undefined' && playSound.kitchenChime) playSound.kitchenChime();
              } else if (type === 'ORDER_APPROVED') {
                setOrders(p => p.map(o => o.id === payload.id ? payload : o));
                if (typeof playSound !== 'undefined' && playSound.kitchenChime) playSound.kitchenChime();
              } else if (type === 'STATUS') {
                setOrders(p => p.map(o => o.id === payload.id ? { ...o, status: payload.status } : o));
              } else if (type === 'CLEAR_ORDERS') {
                setOrders([]);
                setActiveOrderId(null);
              } else if (type === 'CALL') {
                setServiceCalls(p => {
                  if (p.some(c => c.id === payload.id)) return p;
                  return [payload, ...p];
                });
                if (typeof playSound !== 'undefined' && playSound.waiterAlert) playSound.waiterAlert();
              } else if (type === 'RESOLVE') {
                setServiceCalls(p => p.map(c => c.id === payload.id ? payload : c));
              } else if (type === 'ITEMS') {
                setItems(payload);
              } else if (type === 'TABLES') {
                setTables(payload);
              }
            } catch (err) {}
          });

          window.__SM_MQTT_CLIENT__ = client;
        } catch (e) {}

        return () => {
          if (client) {
            try { client.end(); } catch (e) {}
          }
        };
      }, [venueId, clientId]);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2800); };

      const addToCart = (item, quantity = 1, selectedOptions = {}, selectedExtras = [], notes = '', diningOption = null) => {
        const extrasTotal = (Array.isArray(selectedExtras) ? selectedExtras : []).reduce((s, e) => s + (e.price || 0), 0);
        const unitPrice = item.price + extrasTotal;
        const itemDining = diningOption || orderType || 'dine_in';
        const cartItem = {
          cartId: `${item.id}-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          itemId: item.id,
          name: item.name,
          image: item.image,
          unitPrice,
          totalItemPrice: unitPrice * quantity,
          quantity,
          selectedOptions: typeof selectedOptions === 'object' && selectedOptions !== null ? selectedOptions : {},
          selectedExtras: Array.isArray(selectedExtras) ? selectedExtras : [],
          notes: typeof notes === 'string' ? notes : (typeof selectedOptions === 'string' ? selectedOptions : ''),
          station: item.station || 'kitchen',
          diningOption: itemDining
        };
        setCart(p => [...p, cartItem]);
        showToast(`Added: ${item.name} (${itemDining === 'takeaway' ? '🛍️ Takeaway' : '🍽️ Table'})`);
      };

      const toggleCartItemDiningOption = (cartId) => {
        setCart(p => p.map(i => {
          if (i.cartId === cartId) {
            const nextMode = i.diningOption === 'takeaway' ? 'dine_in' : 'takeaway';
            showToast(nextMode === 'takeaway' ? `🛍️ ${i.name} set for Takeaway` : `🍽️ ${i.name} set for Table`);
            return { ...i, diningOption: nextMode };
          }
          return i;
        }));
      };

      const removeFromCart = (cartId) => setCart(p => p.filter(i => i.cartId !== cartId));
      const updateCartQuantity = (cartId, qty) => {
        if (qty <= 0) return removeFromCart(cartId);
        setCart(p => p.map(i => i.cartId === cartId ? { ...i, quantity: qty, totalItemPrice: i.unitPrice * qty } : i));
      };
      const clearCart = () => setCart([]);

      const submitOrder = ({ paymentMethod, customerName: name, notes, tipAmount = 0, surchargeAmount = 0, splitCount, splitShareAmount, orderType: oType, takeawayTime: tTime }) => {
        if (cart.length === 0) {
          showToast('⚠️ Cart is empty!');
          return null;
        }

        const isCounter = paymentMethod === 'counter_cash' || paymentMethod === 'counter_eftpos' || paymentMethod === 'counter';
        const rawItemsSubtotal = cart.reduce((s, i) => s + i.totalItemPrice, 0);
        const calcGst = Number((rawItemsSubtotal / 11).toFixed(2));
        const finalSplitCount = splitCount || 1;
        const total = (rawItemsSubtotal + tipAmount + surchargeAmount) / finalSplitCount;

        const counterPin = Math.floor(1000 + Math.random() * 9000).toString();

        const newOrder = {
          id: `ord-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          orderNumber: Math.floor(100 + Math.random() * 900),
          counterPin: counterPin,
          venueId: venueId,
          tableNumber: oType === 'takeaway' ? 'TAKEAWAY' : activeTable,
          orderType: oType || orderType || 'dine_in',
          takeawayTime: tTime || takeawayTime || 'ASAP',
          customerName: name || 'Guest',
          items: [...cart],
          subtotal: rawItemsSubtotal,
          gstAmount: calcGst,
          tipAmount: tipAmount / finalSplitCount,
          surchargeAmount: surchargeAmount / finalSplitCount,
          splitCount: finalSplitCount,
          totalAmount: total,
          status: isCounter ? 'pending_approval' : 'new',
          paymentStatus: isCounter ? 'pending' : 'paid',
          paymentMethod: paymentMethod || 'online_card',
          notes: notes || '',
          createdAt: new Date().toISOString()
        };

        setOrders(p => [newOrder, ...p]);
        setActiveOrderId(newOrder.id);
        clearCart();
        playSound.orderSuccess();
        broadcastEvent('NEW_ORDER', newOrder);
        return newOrder;
      };

      const approveCounterOrder = (orderId, pinEntered, paidMethod = 'counter_cash', updatedFields = {}) => {
        const ord = orders.find(o => o.id === orderId || (pinEntered && String(o.counterPin) === String(pinEntered).trim()));
        if (!ord) {
          showToast('❌ Order not found or PIN mismatch');
          return { success: false, error: 'Order not found' };
        }
        if (pinEntered && String(ord.counterPin) !== String(pinEntered).trim()) {
          showToast('❌ Invalid 4-digit PIN!');
          return { success: false, error: 'Invalid PIN' };
        }
        const updated = {
          ...ord,
          ...updatedFields,
          status: 'new',
          paymentStatus: 'paid',
          paymentMethod: paidMethod || ord.paymentMethod || 'counter',
          paidAt: new Date().toISOString()
        };
        setOrders(p => p.map(o => o.id === ord.id ? updated : o));
        if (typeof playSound !== 'undefined' && playSound.kitchenChime) {
          playSound.kitchenChime();
        }
        showToast(`✓ Order #${ord.orderNumber} (PIN ${ord.counterPin}) confirmed & sent to kitchen!`);
        broadcastEvent('ORDER_APPROVED', updated);
        return { success: true, order: updated };
      };

      const cancelCounterOrder = (orderId) => {
        const ord = orders.find(o => o.id === orderId);
        const updated = orders.map(o => o.id === orderId ? { ...o, status: 'cancelled', paymentStatus: 'cancelled' } : o);
        setOrders(updated);
        if (activeOrderId === orderId) {
          setActiveOrderId(null);
        }
        showToast(`Order #${ord ? ord.orderNumber : ''} cancelled and voided`);
        broadcastEvent('STATUS', { id: orderId, status: 'cancelled' });
      };

      const sendServiceCall = (type = 'call_waiter') => {
        const call = {
          id: `call-${Date.now()}`,
          tableNumber: activeTable,
          type,
          message: type === 'water' ? 'Table Water Request' : type === 'request_bill' ? 'Bill / EFTPOS Request' : 'Waiter Assistance',
          status: 'pending',
          createdAt: new Date().toISOString()
        };
        setServiceCalls(p => [call, ...p]);
        showToast('🔔 Waiter has been called to your table!');
        broadcastEvent('CALL', call);
      };

      const resolveServiceCall = (id) => {
        const updated = serviceCalls.map(c => c.id === id ? { ...c, status: 'resolved' } : c);
        setServiceCalls(updated);
        broadcastEvent('RESOLVE', updated.find(c => c.id === id));
      };

      const updateOrderStatus = (id, st) => {
        const updated = orders.map(o => o.id === id ? { ...o, status: st } : o);
        setOrders(updated);
        broadcastEvent('STATUS', updated.find(o => o.id === id));
      };

      const toggleItemStock = (id) => {
        const updated = items.map(i => i.id === id ? { ...i, isAvailable: !i.isAvailable } : i);
        setItems(updated);
        const it = updated.find(i => i.id === id);
        showToast(it.isAvailable ? `"${it.name}" marked as In Stock` : `"${it.name}" marked as Sold Out (86)`);
        broadcastEvent('ITEMS', updated);
      };

      const toggleItemVisibility = (id) => {
        const updated = items.map(i => i.id === id ? { ...i, isVisible: i.isVisible === false ? true : false } : i);
        setItems(updated);
        const it = updated.find(i => i.id === id);
        showToast(it.isVisible !== false ? `"${it.name}" is now visible on menu` : `"${it.name}" hidden from customer menu`);
        broadcastEvent('ITEMS', updated);
      };

      const saveItem = (item) => {
        let updated;
        if (item.id) {
          updated = items.map(i => i.id === item.id ? { ...i, ...item } : i);
          showToast(`Item "${item.name}" updated!`);
        } else {
          const newItem = { ...item, id: `item-${Date.now()}`, isAvailable: item.isAvailable !== false, isVisible: item.isVisible !== false };
          updated = [newItem, ...items];
          showToast(`New item "${item.name}" created!`);
        }
        setItems(updated);
        broadcastEvent('ITEMS', updated);
      };

      const deleteItem = (id) => {
        const updated = items.filter(i => i.id !== id);
        setItems(updated);
        showToast(`Item removed from menu`);
        broadcastEvent('ITEMS', updated);
      };

      const saveTable = (table) => {
        let updated;
        if (table.id) {
          updated = tables.map(t => t.id === table.id ? { ...t, ...table } : t);
          showToast(`Table "${table.name || table.number}" updated!`);
        } else {
          const newT = {
            id: `tab-${Date.now()}`,
            number: table.number || (tables.length + 1),
            name: table.name || `Table ${table.number || (tables.length + 1)}`,
            area: table.area || 'Main Bistro Hall',
            seats: table.seats ? parseInt(table.seats, 10) : 4
          };
          updated = [...tables, newT];
          showToast(`New table "${newT.name}" added successfully!`);
        }
        setTables(updated);
        broadcastEvent('TABLES', updated);
      };

      const deleteTable = (id) => {
        if (tables.length <= 1) {
          showToast('Keep at least 1 table configured in venue');
          return;
        }
        const updated = tables.filter(t => t.id !== id);
        setTables(updated);
        showToast('Table deleted successfully');
        broadcastEvent('TABLES', updated);
      };

      const updateRestaurantSettings = (newSettings) => {
        setRestaurant(p => {
          const updated = { ...p, ...newSettings };
          return updated;
        });
        showToast('⚙️ Venue Settings updated!');
        broadcastEvent('SETTINGS', newSettings);
      };

      const clearAllOrders = () => {
        setOrders([]);
        setActiveOrderId(null);
        showToast('🗑️ All orders cleared from memory!');
        broadcastEvent('CLEAR_ORDERS');
      };

      const resetDemoData = () => {
        setItems(INITIAL_ITEMS_AU);
        setTables(INITIAL_TABLES_AU);
        setOrders([]);
        setActiveOrderId(null);
        setServiceCalls([]);
        showToast('Menu reset and orders cleared!');
        broadcastEvent('RESET_DEMO');
      };

      const activeOrder = orders.find(o => o.id === activeOrderId);

      return (
        <OrderContextAU.Provider value={{
          venueId, restaurant, setRestaurant, updateRestaurantSettings, categories, items, tables, orders, serviceCalls,
          cart, addToCart, removeFromCart, updateCartQuantity, clearCart, toggleCartItemDiningOption,
          submitOrder, sendServiceCall, resolveServiceCall, updateOrderStatus,
          approveCounterOrder, cancelCounterOrder, clearAllOrders,
          toggleItemStock, toggleItemVisibility, saveItem, deleteItem, saveTable, deleteTable, resetDemoData,
          activeTable, setActiveTable, orderType, setOrderType, takeawayTime, setTakeawayTime,
          customerName, setCustomerName,
          theme, setTheme, toggleTheme,
          activeOrder, activeOrderId, setActiveOrderId, toastMsg, showToast
        }}>
          {children}
          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-orange-500 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-2xl animate-bounce">
              {toastMsg}
            </div>
          )}
        </OrderContextAU.Provider>
      );
    }

    function useOrderAU() { return useContext(OrderContextAU); }

    // --- Customer Component (Australia) - Modern Mobile UI ---
    function CustomerViewAU() {
      const {
        categories, items, cart, activeOrder, activeTable, setActiveTable, tables, restaurant,
        customerName, setCustomerName, orderType, setOrderType, takeawayTime, setTakeawayTime,
        addToCart, removeFromCart, updateCartQuantity,
        toggleCartItemDiningOption, submitOrder, sendServiceCall, orders,
        cancelCounterOrder, setActiveOrderId, theme, toggleTheme
      } = useOrderAU();

      const currentTable = useMemo(() => {
        return tables?.find(t => String(t.number) === String(activeTable) || t.id === String(activeTable)) || { number: activeTable, name: `Table ${activeTable}`, area: 'Main Bistro Hall' };
      }, [tables, activeTable]);

      const [selCat, setSelCat] = useState('all');
      const [search, setSearch] = useState('');

                    </div>

                    {/* Invoice Body */}
                    <div className={`p-4 sm:p-5 overflow-y-auto space-y-4 text-xs font-sans ${
                      theme === 'light' ? 'bg-[#fffefc] text-stone-900' : 'bg-[#181411] text-stone-100'
                    }`}>
                      {/* Restaurant Details */}
                      <div className={`text-center pb-3 border-b-2 border-dashed space-y-0.5 ${
                        theme === 'light' ? 'border-stone-300' : 'border-stone-800'
                      }`}>
                        <h3 className={`font-black text-base uppercase tracking-tight ${theme === 'light' ? 'text-stone-950' : 'text-white'}`}>{restaurant.name}</h3>
                        <p className={`text-[11px] font-medium ${theme === 'light' ? 'text-stone-600' : 'text-stone-400'}`}>{restaurant.address}</p>
                        <p className={`text-xs font-mono font-bold pt-0.5 ${theme === 'light' ? 'text-stone-900' : 'text-stone-300'}`}>ABN: {restaurant.abn}</p>
                        <span className="inline-block mt-1 bg-amber-500 text-stone-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider shadow-xs">
                          TAX INVOICE (AU)
                        </span>
                      </div>

                      {/* Order & Patron Meta */}
                      <div className={`p-3 rounded-2xl border-2 space-y-1.5 text-[11px] ${
                        theme === 'light' ? 'bg-stone-50 border-stone-200 text-stone-900' : 'bg-stone-900 border-stone-800 text-stone-200'
                      }`}>
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-stone-600">ORDER NUMBER:</span>
                          <span className="font-mono font-black text-xs bg-amber-500 text-stone-950 px-2 py-0.5 rounded-md">#{ord.orderNumber}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-stone-600">Service:</span>
                          <strong className="uppercase font-black">
                            {isHybrid ? `Table #${ord.tableNumber} + Takeaway` : (isTakeawayOnly ? '🛍️ Takeaway Pickup' : `🍽️ Table #${ord.tableNumber}`)}
                          </strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-stone-600">Patron:</span>
                          <strong className="font-black">{ord.customerName || 'Guest Patron'}</strong>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-stone-600">Date & Time:</span>
                          <span className="font-medium">{new Date(ord.createdAt || Date.now()).toLocaleString('en-AU')}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-stone-600">Payment Status:</span>
                          <strong className="text-emerald-600 font-black">
                            {ord.paymentStatus === 'paid'
                              ? (ord.paymentMethod === 'counter_cash'
                                  ? '✓ PAID AT COUNTER (CASH)'
                                  : ord.paymentMethod === 'counter_eftpos'
                                  ? '✓ PAID AT COUNTER (EFTPOS)'
                                  : ord.paymentMethod === 'counter'
                                  ? '✓ PAID AT COUNTER'
                                  : ord.paymentMethod === 'apple_pay'
                                  ? '✓ PAID (APPLE PAY)'
                                  : '✓ PAID ONLINE (STRIPE CARD)')
                              : '⏳ PENDING PAYMENT AT COUNTER'}
                          </strong>
                        </div>
                      </div>

                      {/* Itemized Line Items */}
                      <div className="space-y-2">
                        <div className={`text-[11px] font-black border-b pb-1 flex justify-between uppercase ${
                          theme === 'light' ? 'text-stone-700 border-stone-300' : 'text-stone-400 border-stone-800'
                        }`}>
                          <span>ITEM & DESCRIPTION</span>
                          <span>PRICE (AUD)</span>
                        </div>
                        {ord.items?.map((it, idx) => (
                          <div key={idx} className={`flex justify-between items-start text-xs border-b pb-1.5 ${
                            theme === 'light' ? 'border-stone-100' : 'border-stone-900'
                          }`}>
                            <div>
                              <span className={`font-black ${theme === 'light' ? 'text-stone-950' : 'text-white'}`}>{it.quantity}x {it.name}</span>
                              {it.selectedOptions && Object.entries(it.selectedOptions).map(([k, v]) => (
                                <span key={k} className={`block text-[10px] pl-3 font-medium ${theme === 'light' ? 'text-stone-600' : 'text-stone-400'}`}>▶ {k}: {v}</span>
                              ))}
                              {it.selectedExtras?.map((ex, exi) => (
                                <span key={exi} className="block text-[10px] text-emerald-600 font-bold pl-3">+ {ex.name} (${ex.price?.toFixed(2)})</span>
                              ))}
                            </div>
                            <span className={`font-mono font-black ${theme === 'light' ? 'text-stone-950' : 'text-amber-300'}`}>${(it.totalItemPrice || (it.price * it.quantity)).toFixed(2)}</span>
                          </div>
                        ))}
                      </div>

                      {/* Totals & GST */}
                      <div className={`p-3 rounded-2xl border-2 space-y-1 text-xs ${
                        theme === 'light' ? 'bg-stone-50 border-stone-200 text-stone-900' : 'bg-stone-900 border-stone-800 text-stone-200'
                      }`}>
                        <div className="flex justify-between text-stone-600 font-medium"><span>Items Subtotal:</span><span>${subtotalCalc.toFixed(2)}</span></div>
                        {ord.surchargeAmount > 0 && (
                          <div className="flex justify-between text-stone-600 font-medium"><span>Card Surcharge:</span><span>+${ord.surchargeAmount.toFixed(2)}</span></div>
                        )}
                        {ord.tipAmount > 0 && (
                          <div className="flex justify-between text-stone-600 font-medium"><span>Staff Tip:</span><span>+${ord.tipAmount.toFixed(2)}</span></div>
                        )}
                        <div className={`flex justify-between font-black text-sm pt-1.5 border-t-2 ${
                          theme === 'light' ? 'border-stone-300 text-stone-950' : 'border-stone-700 text-white'
                        }`}>
                          <span>TOTAL PAID (AUD):</span>
                          <span className="text-base font-mono text-emerald-600 font-black">${ord.totalAmount?.toFixed(2)}</span>
                        </div>
                        <div className="text-[10px] text-stone-500 text-right pt-0.5 font-bold">
                          Includes ${gstCalc.toFixed(2)} GST (10%)
                        </div>
                      </div>
                    </div>

                    {/* Modal Footer CTA */}
                    <div className={`p-3.5 border-t-2 flex gap-2 ${
                      theme === 'light' ? 'bg-stone-50 border-stone-200' : 'bg-[#221a14] border-stone-800'
                    }`}>
                      <button
                        type="button"
                        onClick={() => {
                          window.print();
                        }}
                        className="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:brightness-110 text-stone-950 font-black py-2.5 px-3 rounded-xl text-xs shadow-lg flex items-center justify-center gap-1.5 transition-all active:scale-95 cursor-pointer border border-amber-400"
                      >
                        <span>📥 Save PDF / Print Tax Invoice</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setViewInvoiceModal(false)}
                        className={`font-bold px-4 py-2.5 rounded-xl text-xs cursor-pointer border transition-all ${
                          theme === 'light'
                            ? 'bg-stone-200 hover:bg-stone-300 text-stone-900 border-stone-300'
                            : 'bg-stone-800 hover:bg-stone-700 text-stone-200 border-stone-700'
                        }`}
                      >
                        Close
                      </button>
                    </div>
                  </div>
                </div>

                {/* Hidden Printable Tax Invoice for window.print() */}
                <div id="printable-tax-invoice" className="print-only">
                  <div style={{ textAlign: 'center', marginBottom: '8px' }}>
                    <div style={{ fontWeight: 900, fontSize: '15px' }}>{restaurant.name}</div>
                    <div style={{ fontSize: '11px' }}>{restaurant.address}</div>
                    <div style={{ fontSize: '11px', fontWeight: 'bold' }}>ABN: {restaurant.abn}</div>
                    <div style={{ fontSize: '13px', fontWeight: 900, marginTop: '4px', textDecoration: 'underline' }}>TAX INVOICE</div>
                  </div>
                  <div style={{ borderBottom: '1px dashed #000', margin: '6px 0' }}></div>
                  <div style={{ fontSize: '11px', lineHeight: '1.4' }}>
                    <div>Order: <strong>#{ord.orderNumber}</strong></div>
                    <div>Table: <strong>{isHybrid ? `Table ${ord.tableNumber} + Takeaway` : (isTakeawayOnly ? 'Takeaway' : `Table ${ord.tableNumber}`)}</strong></div>
                    <div>Date: {new Date(ord.createdAt || Date.now()).toLocaleString('en-AU')}</div>
                    <div>Payment: <strong>{ord.paymentStatus === 'paid' ? 'PAID' : 'PENDING'}</strong></div>
                  </div>
                  <div style={{ borderBottom: '1px dashed #000', margin: '6px 0' }}></div>
                  <div style={{ fontSize: '11px' }}>
                    {ord.items?.map((it, idx) => (
                      <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '3px' }}>
                        <div>
                          <strong>{it.quantity}x</strong> {it.name}
                        </div>
                        <div>${(it.totalItemPrice || (it.price * it.quantity)).toFixed(2)}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ borderBottom: '1px dashed #000', margin: '6px 0' }}></div>
                  <div style={{ fontSize: '11px', lineHeight: '1.4' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Subtotal:</span>
                      <span>${subtotalCalc.toFixed(2)}</span>
                    </div>
                    {ord.surchargeAmount > 0 && (
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span>Card Surcharge:</span>
                        <span>+${ord.surchargeAmount.toFixed(2)}</span>
                      </div>
                    )}
                    {ord.tipAmount > 0 && (
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span>Tip:</span>
                        <span>+${ord.tipAmount.toFixed(2)}</span>
                      </div>
                    )}
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 900, fontSize: '13px', marginTop: '4px' }}>
                      <span>TOTAL (AUD):</span>
                      <span>${ord.totalAmount?.toFixed(2)}</span>
                    </div>
                    <div style={{ textAlign: 'right', fontSize: '10px', marginTop: '2px' }}>
                      Includes ${gstCalc.toFixed(2)} GST (10%)
                    </div>
                  </div>
                  <div style={{ borderBottom: '1px dashed #000', margin: '8px 0' }}></div>
                  <div style={{ textAlign: 'center', fontSize: '10px', marginTop: '6px' }}>
                    Thank you for dining with us!<br/>
                    Please retain this Tax Invoice for your records.
                  </div>
                </div>
              </>
            );
          })()}
        </div>
      );
    }


    function App() {
      const { theme } = useOrderAU();
      return (
        <div className={`min-h-screen ${theme === 'light' ? 'theme-light bg-[#f8f6f2] text-stone-900' : 'theme-dark bg-[#0e0c0a] text-stone-100'} flex flex-col font-sans transition-colors duration-200`}>
          <CustomerViewAU />
        </div>
      );
    }

    function Root() {
      return (
        <OrderProviderAU>
          <App />
        </OrderProviderAU>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
