    // --- Web Audio Synthesizer (Zero-delay Chimes) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const playSound = {
      kitchenChime: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc1.start(now); osc1.stop(now + 0.8);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(830.61, now + 0.2);
          gain2.gain.setValueAtTime(0.35, now + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(now + 0.2); osc2.stop(now + 1.2);
        } catch(e) {}
      },
      waiterAlert: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [0, 0.15, 0.3].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880 + idx * 110, now + delay);
            gain.gain.setValueAtTime(0.2, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + delay); osc.stop(now + delay + 0.3);
          });
        } catch(e) {}
      },
      orderSuccess: () => {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (i * 0.08));
            gain.gain.setValueAtTime(0.25, now + (i * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.6);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + (i * 0.08)); osc.stop(now + (i * 0.08) + 0.6);
          });
        } catch(e) {}
      }
    };

          else if (type === 'ITEMS') { setItems(payload); }
          else if (type === 'TABLES') { setTables(payload); }
        };
        channel.addEventListener('message', handler);

          image: item.image,

          totalItemPrice: unitPrice * quantity,
          quantity,
          selectedOptions: typeof selectedOptions === 'object' && selectedOptions !== null ? selectedOptions : {},
          selectedExtras: Array.isArray(selectedExtras) ? selectedExtras : [],

        if (cart.length === 0) return null;
        const hasDineIn = cart.some(i => i.diningOption === 'dine_in');
        const hasTakeaway = cart.some(i => i.diningOption === 'takeaway');
        const calculatedType = (hasDineIn && hasTakeaway) ? 'hybrid' : (hasTakeaway ? 'takeaway' : 'dine_in');
        const finalOrderType = oType || calculatedType;

        const subtotal = cart.reduce((s, i) => s + i.totalItemPrice, 0);

          abn: restaurant.abn,
          paymentMethod,
          splitCount: (hasDineIn && !hasTakeaway) ? (splitCount || 1) : 1,
          splitShareAmount: (hasDineIn && !hasTakeaway) ? (splitShareAmount || totalAmount) : totalAmount,
          paymentStatus: paymentMethod === 'counter' ? 'pending_counter' : 'paid',
          status: 'new',
          station: hasKitchen && hasBar ? 'both' : (hasBar ? 'bar' : 'kitchen'),
          notes: notes || '',

        };

        setOrders(p => [newOrder, ...p]);

        clearCart();
        playSound.orderSuccess();
        if (channel) channel.postMessage({ type: 'NEW_ORDER', payload: newOrder });

        };

      const resolveServiceCall = (id) => {

        setServiceCalls(updated);
        if (channel) channel.postMessage({ type: 'RESOLVE', payload: updated.find(c => c.id === id) });
      };

      const updateOrderStatus = (id, st) => {
        const updated = orders.map(o => o.id === id ? { ...o, status: st } : o);

        if (channel) channel.postMessage({ type: 'STATUS', payload: updated.find(o => o.id === id) });

        showToast(`Item removed from menu`);

      const saveTable = (table) => {

              {toastMsg}

                      </div>
                      <div className="flex justify-between">
                        <span className="text-stone-600">Date & Time:</span>
                        <span className="text-stone-800">{new Date(ord.createdAt || Date.now()).toLocaleString('en-AU')}</span>
                      </div>
                      {ord.takeawayTime && (
                        <div className="flex justify-between text-emerald-800 font-bold bg-emerald-50 px-1 rounded">
                          <span>Pickup Time:</span>
                          <span>{ord.takeawayTime}</span>
                        </div>
                      )}
                      <div className="flex justify-between">
                        <span className="text-stone-600">Payment Status:</span>
                        <strong className={ord.paymentStatus === 'paid' ? 'text-emerald-700' : 'text-amber-700'}>
                          {ord.paymentStatus === 'paid' ? '✓ PAID' : '⏳ PENDING AT BAR'} ({ord.paymentMethod === 'apple_pay' ? 'Apple Pay' : ord.paymentMethod === 'credit_card' ? 'Credit Card' : 'Counter Cash / EFTPOS'})
                        </strong>
                      </div>
                    </div>

                    {/* Itemized Items with Unit Prices, Options and Extras */}
                    <div className="space-y-2.5 pt-1">
                      <div className="text-[11px] font-black text-stone-700 border-b border-stone-300 pb-1 flex justify-between uppercase">
                        <span>ITEM DESCRIPTION & OPTIONS</span>
                        <span>PRICE</span>
                      </div>

                      {ord.items?.map((it, idx) => {
                        const itemUnitPrice = it.unitPrice || it.price;
                        const itemLineTotal = it.totalItemPrice || (itemUnitPrice * it.quantity);

                        return (
                          <div key={idx} className="border-b border-dashed border-stone-200 pb-2 space-y-1">
                            <div className="flex justify-between items-baseline font-bold text-black text-xs">
                              <span className="flex-1 pr-2">
                                <strong className="bg-black text-white px-1.5 py-0.5 rounded text-[11px] mr-1.5 font-mono">{it.quantity}x</strong>
                                <span className="uppercase">{it.name}</span>
                                {it.diningOption === 'takeaway' && (
                                  <span className="ml-1 text-[9px] bg-stone-200 text-stone-700 px-1 py-0.5 rounded font-sans font-bold">[TAKEAWAY]</span>
                                )}
                              </span>
                              <span className="font-mono font-black whitespace-nowrap text-stone-900">
                                ${itemLineTotal.toFixed(2)}
                              </span>
                            </div>

                            {/* Unit price if qty > 1 */}
                            {it.quantity > 1 && (
                              <div className="text-[10px] text-stone-500 pl-6">
                                ({it.quantity} × ${itemUnitPrice.toFixed(2)} ea)
                              </div>
                            )}

                            {/* Selected Options */}
                            {it.selectedOptions && Object.entries(it.selectedOptions).map(([k, v]) => (
                              <div key={k} className="text-[10px] text-stone-600 pl-6">
                                ▶ <u>{k}:</u> <strong>{v}</strong>
                              </div>
                            ))}

                            {/* Extras with pricing */}
                            {it.selectedExtras?.map((ex, exi) => (
                              <div key={exi} className="text-[10px] text-emerald-800 font-bold pl-6 flex justify-between pr-1">
                                <span>+ Extra: {ex.name}</span>
                                <span className="font-mono">+${(ex.price || 0).toFixed(2)}</span>
                              </div>
                            ))}

                            {/* Notes / Allergies */}
                            {it.notes && (
                              <div className="text-[10px] bg-amber-50 border border-amber-300 text-stone-900 px-2 py-0.5 rounded ml-5 font-sans font-bold">
                                ⚠️ Note: {it.notes}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    {/* Financial Summary & Australian Tax Calculation */}
                    <div className="border-t-2 border-dashed border-stone-400 pt-2 space-y-1 text-xs">
                      <div className="flex justify-between text-stone-700">
                        <span>Items Subtotal:</span>
                        <span className="font-mono font-bold">${subtotalCalc.toFixed(2)}</span>
                      </div>

                      {surchargeAmt > 0 && (
                        <div className="flex justify-between text-stone-700">
                          <span>Card Processing Surcharge (1.5%):</span>
                          <span className="font-mono font-bold">${surchargeAmt.toFixed(2)}</span>
                        </div>
                      )}

                      {tipAmt > 0 && (
                        <div className="flex justify-between text-emerald-800 font-bold">
                          <span>Staff Gratuity / Tip:</span>
                          <span className="font-mono">${tipAmt.toFixed(2)}</span>
                        </div>
                      )}

                      {/* Grand Total */}
                      <div className="border-t-2 border-black pt-2 mt-1 flex justify-between items-baseline font-sans">
                        <span className="font-black text-sm uppercase">TOTAL AMOUNT (AUD):</span>
                        <span className="text-xl font-black font-mono text-black">${grandTotal.toFixed(2)}</span>
                      </div>

                      {/* GST 10% Breakdown */}
                      <div className="text-[10px] text-stone-500 pt-1 text-right">
                        Includes ${gstIncluded.toFixed(2)} GST (10%)
                      </div>
                    </div>

                    <div className="text-center pt-2 text-[10px] text-stone-500 font-sans border-t border-stone-200">
                      Thank you for visiting {restaurant.name}! • Have a great day
                    </div>
                  </div>

                  {/* Modal Action Buttons */}
                  <div className="p-3.5 bg-stone-100 border-t border-stone-200 grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setSelectedOrderForDetail(null)}
                      className="w-full bg-stone-300 hover:bg-stone-400 text-stone-800 font-bold py-2.5 rounded-xl text-xs transition-all"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:brightness-110 text-white font-black py-2.5 rounded-xl text-xs shadow-lg flex items-center justify-center gap-1.5 transition-all"
                    >
                      <span>🖨️ Print Tax Invoice (80mm)</span>
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Hidden Pure Thermal Receipt (#printable-receipt) for Physical Print with Full Prices */}
          {selectedOrderForDetail && (() => {
            const ord = selectedOrderForDetail;
            const dineInP = ord.items?.filter(i => i.diningOption === 'dine_in') || [];
            const takeawayP = ord.items?.filter(i => i.diningOption === 'takeaway') || [];
            const isHybridP = dineInP.length > 0 && takeawayP.length > 0;
            const subtotalP = ord.items?.reduce((s, i) => s + (i.totalItemPrice || (i.price * i.quantity)), 0) || 0;
            const surchargeP = ord.surchargeAmount || 0;
            const tipP = ord.tipAmount || 0;
            const grandTotalP = ord.totalAmount || (subtotalP + surchargeP + tipP);
            const gstP = grandTotalP / 11;

            return (
              <div id="printable-receipt" className="print-only">
                <div style={{ textAlign: 'center', borderBottom: '2px dashed black', paddingBottom: '8px', marginBottom: '8px' }}>
                  <h2 style={{ fontSize: '16px', fontWeight: '900', margin: '0 0 2px 0', textTransform: 'uppercase' }}>{restaurant.name}</h2>
                  <div style={{ fontSize: '10px' }}>{restaurant.address}</div>
                  <div style={{ fontSize: '10px', fontWeight: 'bold' }}>ABN: {restaurant.abn}</div>
                  <div style={{ fontSize: '11px', fontWeight: '900', margin: '4px 0', border: '1px solid black', padding: '2px' }}>
                    *** TAX INVOICE & RECEIPT ***
                  </div>
                  <div style={{ fontSize: '10px' }}>{new Date(ord.createdAt || Date.now()).toLocaleString('en-AU')}</div>
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', border: '1px solid black', padding: '4px', marginBottom: '6px', fontSize: '11px' }}>
                  <div>
                    <div><strong>{isHybridP ? `TABLE #${ord.tableNumber} + TAKEAWAY` : (ord.orderType === 'takeaway' ? 'TAKEAWAY' : `TABLE #${ord.tableNumber}`)}</strong></div>
                    <div>Patron: {ord.customerName || 'Guest'}</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div>ORDER</div>
                    <div style={{ fontSize: '16px', fontWeight: '900', fontFamily: 'monospace' }}>#{ord.orderNumber}</div>
                  </div>
                </div>

                <div style={{ borderBottom: '1px dashed black', paddingBottom: '4px', marginBottom: '4px', fontSize: '11px', fontWeight: 'bold', display: 'flex', justifyContent: 'space-between' }}>
                  <span>QTY DESCRIPTION</span>
                  <span>TOTAL</span>
                </div>

                <div style={{ marginBottom: '8px' }}>
                  {ord.items?.map((it, idx) => {
                    const unitP = it.unitPrice || it.price;
                    const lineP = it.totalItemPrice || (unitP * it.quantity);
                    return (
                      <div key={idx} style={{ borderBottom: '1px dotted #ccc', padding: '3px 0', fontSize: '11px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <span style={{ fontWeight: 'bold' }}>{it.quantity}x {it.name.toUpperCase()}</span>
                          <span style={{ fontFamily: 'monospace', fontWeight: 'bold' }}>${lineP.toFixed(2)}</span>
                        </div>
                        {it.selectedOptions && Object.entries(it.selectedOptions).map(([k, v]) => (
                          <div key={k} style={{ fontSize: '10px', paddingLeft: '12px' }}>- {k}: {v}</div>
                        ))}
                        {it.selectedExtras?.map((ex, exi) => (
                          <div key={exi} style={{ fontSize: '10px', paddingLeft: '12px', display: 'flex', justifyContent: 'space-between' }}>
                            <span>+ {ex.name}</span>
                            <span>${(ex.price || 0).toFixed(2)}</span>
                          </div>
                        ))}
                        {it.notes && <div style={{ fontSize: '10px', fontStyle: 'italic', paddingLeft: '12px' }}>Note: {it.notes}</div>}
                      </div>
                    );
                  })}
                </div>

                <div style={{ borderTop: '2px dashed black', paddingTop: '4px', fontSize: '11px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>Items Subtotal:</span>
                    <span>${subtotalP.toFixed(2)}</span>
                  </div>
                  {surchargeP > 0 && (
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Card Surcharge:</span>
                      <span>${surchargeP.toFixed(2)}</span>
                    </div>
                  )}
                  {tipP > 0 && (
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Tip:</span>
                      <span>${tipP.toFixed(2)}</span>
                    </div>
                  )}
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '14px', fontWeight: '900', borderTop: '2px solid black', marginTop: '4px', paddingTop: '2px' }}>
                    <span>TOTAL (AUD):</span>
                    <span>${grandTotalP.toFixed(2)}</span>
                  </div>
                  <div style={{ fontSize: '9px', textAlign: 'right', marginTop: '2px' }}>
                    Includes ${gstP.toFixed(2)} GST (10%)
                  </div>
                  <div style={{ fontSize: '10px', textAlign: 'center', marginTop: '4px', fontWeight: 'bold' }}>
                    PAYMENT: {ord.paymentMethod === 'apple_pay' ? 'APPLE PAY' : ord.paymentMethod === 'credit_card' ? 'CREDIT CARD' : 'BAR COUNTER'} ({ord.paymentStatus === 'paid' ? 'PAID' : 'PENDING'})
                  </div>
                  <div style={{ fontSize: '9px', textAlign: 'center', marginTop: '6px' }}>
                    Thank you! See you soon.
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function App() {
      const [role, setRole] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        const v = p.get('view');
        if (v === 'admin') return 'admin';
        if (v === 'kitchen' || v === 'kds') return 'kitchen';
        if (v === 'customer' || v === 'menu') return 'customer';
        if (v === 'simulator') return 'simulator';
        return 'admin'; // Default directly to admin panel for easy access
      });

      return (
        <OrderProviderAU>
          <div className="min-h-screen bg-[#0e0c0a] text-stone-100 flex flex-col font-sans">
            {/* Top Navigation Bar */}
            <nav className="bg-[#161311] border-b border-amber-900/30 px-4 py-3 sticky top-0 z-50 shadow-lg">
              <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="font-black text-sm text-white">🇦🇺 <span className="text-amber-500">SmartMenu</span> Australia ($ AUD)</span>
                </div>

                <div className="flex items-center gap-1.5 bg-[#100e0c] p-1.5 rounded-2xl border border-stone-800">
                  <button
                    onClick={() => setRole('admin')}
                    className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-black transition-all ${
                      role === 'admin'
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg shadow-amber-950/50 scale-105'
                        : 'text-stone-300 hover:text-white bg-[#1e1916] hover:bg-[#28221e]'
                    }`}
                  >
                    <span>⚙️ Admin Panel (Menu & Prices)</span>
                  </button>

                  <button
                    onClick={() => setRole('customer')}
                    className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      role === 'customer'
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg'
                        : 'text-stone-400 hover:text-white'
                    }`}
                  >
                    <span>📱 Customer Menu</span>
                  </button>

                  <button
                    onClick={() => setRole('kitchen')}
                    className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      role === 'kitchen'
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg'
                        : 'text-stone-400 hover:text-white'
                    }`}
                  >
                    <span>👨‍🍳 Kitchen & Bar KDS</span>
                  </button>

                  <button
                    onClick={() => setRole('simulator')}
                    className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      role === 'simulator'
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg'
                        : 'text-stone-400 hover:text-white'
                    }`}
                  >
                    <span>⚡ Live Dual Screen</span>
                  </button>
                </div>
              </div>
            </nav>
            <div className="flex-1">
              {role === 'customer' && <CustomerViewAU />}
              {role === 'kitchen' && <KitchenDisplayAU />}
              {role === 'admin' && <AdminDashboardAU />}
              {role === 'simulator' && (
                <div className="p-4 grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                  <div className="xl:col-span-5 flex flex-col items-center">
                    <span className="text-xs font-bold text-slate-400 mb-2">📱 Customer Phone (Australia $ AUD)</span>
                    <div className="w-full max-w-[390px] h-[780px] bg-slate-950 border-[5px] border-slate-800 rounded-[40px] shadow-2xl overflow-y-auto hide-scrollbar"><CustomerViewAU /></div>
                  </div>
                  <div className="xl:col-span-7 flex flex-col">
                    <span className="text-xs font-bold text-slate-400 mb-2">👨‍🍳 Kitchen & Bar Display (KDS)</span>
                    <div className="bg-slate-900/60 border border-slate-800 rounded-3xl min-h-[780px]"><KitchenDisplayAU /></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </OrderProviderAU>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
