          if (!res.ok) {

          const data = await res.json();
          const loc = data.location || {};

          const lineItems = (order.items || []).map(it => {
            const unitPrice = it.unitPrice || it.price || 0;
            return {
              name: it.name || 'Dish',
              quantity: String(it.quantity || 1),
              base_price_money: {
                amount: Math.round(unitPrice * 100),
                currency: 'AUD'
              },
              note: it.notes || (it.selectedExtras?.length ? it.selectedExtras.map(e => `+ ${e.name}`).join(', ') : undefined)
            };
          });

          const ticketName = order.orderType === 'takeaway'
            ? `Takeaway #${order.orderNumber} - ${order.customerName || 'Guest'}`
            : `Table #${order.tableNumber} - ${order.customerName || 'Guest'}`;

          const payload = {
            idempotency_key: `sm-${order.id}-${Date.now()}`,
            order: {
              location_id: locationId.trim(),
              reference_id: `SM-${order.orderNumber}`,
              ticket_name: ticketName,
              source: {
                name: 'SmartMenu AU'
              },
              line_items: lineItems,
              taxes: [
                {
                  name: 'GST (10% AU Included)',
                  percentage: '10.0',
                  type: 'INCLUSIVE'
                }
              ],
              fulfillments: [
                {
                  type: order.orderType === 'takeaway' ? 'PICKUP' : 'DINE_IN',
                  state: 'PROPOSED'
                }
              ]
            }
          };

          const res = await fetch(`${baseUrl}/orders`, {
            method: 'POST',
            headers: {
              'Square-Version': '2024-08-21',
              'Authorization': `Bearer ${accessToken.trim()}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.errors?.[0]?.detail || `Square API error (${res.status})`;
            return { success: false, message: errMsg };
          }

          const resData = await res.json();
          const createdSquareOrder = resData.order || {};
          return {
            success: true,
            squareOrderId: createdSquareOrder.id,
            squareReference: createdSquareOrder.reference_id || `SM-${order.orderNumber}`
          };
        } catch (err) {
          return {
            success: false,
            message: err.message || 'Network error sending order to Square POS'
          };
        }
      }

      const [cart, setCart] = useState([]);

      const [toastMsg, setToastMsg] = useState(null);

      // Visual Theme (Light Day Cafe vs Dark Night Lounge)
      const [theme, setThemeState] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        const urlTheme = p.get('theme');
        if (urlTheme === 'light' || urlTheme === 'dark') return urlTheme;
        try {

      const setTheme = (t) => {
        const val = t === 'dark' ? 'dark' : 'light';
        setThemeState(val);
        try { localStorage.setItem('smart_qr_theme_au', val); } catch(e) {}
        if (channel) channel.postMessage({ type: 'THEME', payload: val });

      const toggleTheme = () => {

      const channel = useMemo(() => typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(`smart_qr_sync_${venueId}`) : null, [venueId]);
      const clientId = useMemo(() => `sm_${Math.random().toString(36).substr(2, 9)}`, []);

      const broadcastEvent = useCallback((type, payload) => {
        if (channel) {
          channel.postMessage({ type, payload });
        }
        if (window.__SM_MQTT_CLIENT__ && window.__SM_MQTT_CLIENT__.connected) {
          try {
            window.__SM_MQTT_CLIENT__.publish(window.__SM_MQTT_TOPIC__, JSON.stringify({
              type,
              payload,
              senderId: clientId
            }), { qos: 1 });
          } catch (e) {}
        }
      }, [channel, clientId]);

      useEffect(() => {
        if (!channel) return;
        const handler = (e) => {
          const { type, payload } = e.data || {};
          if (type === 'NEW_ORDER') { setOrders(p => [payload, ...p]); playSound.kitchenChime(); }
          else if (type === 'ORDER_APPROVED') { setOrders(p => p.map(o => o.id === payload.id ? payload : o)); playSound.kitchenChime(); }
          else if (type === 'STATUS') { setOrders(p => p.map(o => o.id === payload.id ? payload : o)); }
          else if (type === 'CLEAR_ORDERS') { setOrders([]); setActiveOrderId(null); }
          else if (type === 'CALL') { setServiceCalls(p => [payload, ...p]); playSound.waiterAlert(); }
          else if (type === 'RESOLVE') { setServiceCalls(p => p.map(c => c.id === payload.id ? payload : c)); }
          else if (type === 'ITEMS') { setItems(payload); }
          else if (type === 'TABLES') { setTables(payload); }
          else if (type === 'THEME') { setThemeState(payload); }
          else if (type === 'RESET_DEMO') { setOrders([]); }
        };
        channel.addEventListener('message', handler);
        return () => channel.removeEventListener('message', handler);
      }, [channel]);

      // Cross-Device Real-Time Cloud Synchronization (Phone <-> Mac/PC KDS)
      useEffect(() => {
        if (typeof mqtt === 'undefined') return;
        const topic = `smartmenu_au_cloud_${venueId}`;
        window.__SM_MQTT_TOPIC__ = topic;
        let client = null;

        try {
          client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            keepalive: 60,
            clientId: `c_${clientId}`,
            clean: true,
            reconnectPeriod: 2500
          });

          client.on('connect', () => {
            client.subscribe(topic, { qos: 1 });
          });

          client.on('message', (t, msg) => {
            if (t !== topic) return;
            try {
              const data = JSON.parse(msg.toString());
              if (!data || data.senderId === clientId) return;
              const { type, payload } = data;

              if (type === 'NEW_ORDER') {
                setOrders(p => {
                  if (p.some(o => o.id === payload.id)) return p;
                  return [payload, ...p];
                });
                if (typeof playSound !== 'undefined' && playSound.kitchenChime) playSound.kitchenChime();
              } else if (type === 'ORDER_APPROVED') {
                setOrders(p => p.map(o => o.id === payload.id ? payload : o));
                if (typeof playSound !== 'undefined' && playSound.kitchenChime) playSound.kitchenChime();
              } else if (type === 'STATUS') {
                setOrders(p => p.map(o => o.id === payload.id ? { ...o, status: payload.status } : o));
              } else if (type === 'CLEAR_ORDERS') {
                setOrders([]);
                setActiveOrderId(null);
              } else if (type === 'CALL') {
                setServiceCalls(p => {
                  if (p.some(c => c.id === payload.id)) return p;
                  return [payload, ...p];
                });
                if (typeof playSound !== 'undefined' && playSound.waiterAlert) playSound.waiterAlert();
              } else if (type === 'RESOLVE') {
                setServiceCalls(p => p.map(c => c.id === payload.id ? payload : c));
              } else if (type === 'ITEMS') {
                setItems(payload);
              } else if (type === 'TABLES') {
                setTables(payload);
              }
            } catch (err) {}
          });

          window.__SM_MQTT_CLIENT__ = client;
        } catch (e) {}

        return () => {
          if (client) {
            try { client.end(); } catch (e) {}
          }
        };

          itemId: item.id,

      const handleProcessBulkImport = () => {
        const raw = (bulkImportText || '').trim();
        if (!raw) {
          if (showToast) showToast("⚠️ Please paste CSV or upload a file first");
          return;
        }

        try {
          let newDishes = [];
          if (bulkImportMode === 'json' || raw.startsWith('[]'.slice(0, 1))) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              newDishes = parsed.map((it, idx) => ({
                id: it.id || `bulk-${Date.now()}-${idx}`,
                categoryId: it.categoryId || 'bites',
                name: it.name || `Dish #${idx + 1}`,
                description: it.description || '',
                price: parseFloat(it.price) || 15.00,
                image: it.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80',
                station: it.station || 'kitchen',
                isAvailable: it.isAvailable !== false,
                isVisible: it.isVisible !== false,
                isGF: !!it.isGF,
                isVegetarian: !!it.isVegetarian,
                options: it.options || [],
                extras: it.extras || []
              }));
            }
          } else {
            const lines = raw.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length <= 1) {
              if (showToast) showToast("⚠️ CSV has no data rows");
              return;
            }

            const headerLine = lines[0];
            const delimiter = headerLine.includes(';') ? ';' : ',';
            const dataRows = lines.slice(1);

            newDishes = dataRows.map((line, idx) => {
              let matches = [];
              if (delimiter === ';') {
                matches = line.split(';').map(c => c.replace(/^"|"$/g, '').trim());
              } else {
                matches = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
              }

              const [name, catName, priceStr, desc, img, gfStr, vegStr, stationStr] = matches;
              if (!name || !name.trim()) return null;

              let matchedCat = categories.find(c => c.name.toLowerCase() === (catName || '').toLowerCase() || c.id === catName);

                        max="100"
                        value={vTables}
                        onChange={(e) => setVTables(e.target.value)}
                        className="w-full rounded-xl px-3 py-2 text-xs font-mono border focus:outline-none focus:border-amber-500 bg-slate-950 border-slate-800 text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-stone-300">
                        Physical Address
                      </label>
                      <input
                        type="text"
                        value={vAddress}
                        onChange={(e) => setVAddress(e.target.value)}
                        placeholder="e.g. 100 Main Street, Sydney NSW 2000"
                        className="w-full rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-amber-500 bg-slate-950 border-slate-800 text-white"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1 text-stone-300">
                        ABN (Tax Invoice)
                      </label>
                      <input
                        type="text"
                        value={vAbn}
                        onChange={(e) => setVAbn(e.target.value)}
                        placeholder="e.g. 51 824 753 556"
                        className="w-full rounded-xl px-3 py-2 text-xs font-mono border focus:outline-none focus:border-amber-500 bg-slate-950 border-slate-800 text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1 text-stone-300">
                        Contact Person (Manager)
                      </label>
                      <input
                        type="text"
                        value={vContact}
                        onChange={(e) => setVContact(e.target.value)}
                        placeholder="e.g. John Doe"
                        className="w-full rounded-xl px-3 py-2 text-xs border focus:outline-none focus:border-amber-500 bg-slate-950 border-slate-800 text-white"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1 text-stone-300">
                        SaaS Subscription Plan
                      </label>
                      <select
                        value={vPlan}
                        onChange={(e) => setVPlan(e.target.value)}
                        className="w-full rounded-xl px-3 py-2 text-xs font-bold border focus:outline-none focus:border-amber-500 bg-slate-950 border-slate-800 text-white"
                      >
                        <option value="Pro Multi-Station ($149/mo)">Pro Multi-Station ($149/mo) - Full KDS & Square</option>
                        <option value="Starter QR ($99/mo)">Starter QR ($99/mo) - Menu & Orders</option>
                        <option value="Enterprise Custom ($299/mo)">Enterprise Custom ($299/mo)</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsCreateOpen(false)}
                      className="px-4 py-2 rounded-xl font-bold bg-slate-800 text-stone-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-stone-950 font-black shadow-lg hover:brightness-110 active:scale-95"
                    >
                      🚀 Create Venue & Generate Links
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Client Handover Pack & WhatsApp Generator */}
          {selectedVenueForShare && (() => {
            const v = selectedVenueForShare;
            const cust = getCustomerUrl(v.slug);
            const kitch = getKitchenUrl(v.slug);
            const adm = getAdminUrl(v.slug);
            const msg = getWhatsAppMessage(v);

            return (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto no-print">
                <div className="border-2 rounded-3xl p-5 md:p-6 w-full max-w-xl space-y-4 shadow-2xl animate-in fade-in zoom-in duration-150 font-sans bg-slate-900 border-slate-700 text-white">
                  <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                    <div className="flex items-center gap-2.5">
                      <span className="text-2xl p-2 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">📦</span>
                      <div>
                        <h3 className="font-extrabold text-base">Client Onboarding Pack: {v.name}</h3>
                        <p className="text-xs text-stone-400">
                          All 3 links and 6-digit Manager PIN ready for delivery
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => setSelectedVenueForShare(null)}
                      className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-stone-300 flex items-center justify-center font-bold text-xs cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3 text-xs">
                    {/* Preformatted WhatsApp Box */}
                    <div>
                      <label className="font-bold block mb-1 text-stone-300">
                        Formatted WhatsApp / Email Handover Message:
                      </label>
                      <textarea
                        rows="9"
                        readOnly
                        value={msg}
                        className="w-full font-mono text-[11px] p-3 rounded-2xl border bg-slate-950 border-slate-800 text-emerald-300"
                      />
                    </div>

                    <div className="flex flex-wrap justify-between items-center gap-2 pt-2 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={() => copyToClipboard(msg, 'Full Onboarding Message')}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 shadow-lg cursor-pointer"
                      >
                        <span>📋 Copy WhatsApp Message</span>
                      </button>

                      <a
                        href={`https://wa.me/?text=${encodeURIComponent(msg)}`}
                        target="_blank"
                        rel="noreferrer"
                        className="bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-1.5 shadow"
                      >
                        <span>💬 Open in WhatsApp</span>
                        <span>↗</span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function AppContent() {
      const { orders, theme, toggleTheme } = useOrderAU();
      const pendingCount = orders.filter(o => o.status === 'pending_approval').length;
      
      const [role, setRole] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        const v = p.get('view');
        const hasTable = p.get('table');
        const isTakeaway = p.get('mode') === 'takeaway' || p.get('type') === 'takeaway';

        if (v === 'master' || v === 'superadmin' || v === 'agency') return 'master';
        if (v === 'admin') return 'admin';
        if (v === 'kitchen' || v === 'kds') return 'kitchen';
        if (v === 'simulator') return 'simulator';
        if (v === 'customer' || v === 'menu' || hasTable !== null || isTakeaway) return 'customer';
        return 'customer'; // Default to customer menu on any QR scan or direct link
      });

      useEffect(() => {
        const handleSwitchRole = (e) => {
          if (e.detail) setRole(e.detail);
        };
        window.addEventListener('switch-app-role', handleSwitchRole);
        return () => window.removeEventListener('switch-app-role', handleSwitchRole);
      }, []);

      const handleOpenCashierPin = () => {
        setRole('admin');
        setTimeout(() => {
          window.dispatchEvent(new CustomEvent('switch-admin-tab', { detail: 'cashier' }));
        }, 50);
      };

      return (
        <div className={`min-h-screen ${theme === 'light' ? 'theme-light bg-[#f8f6f2] text-stone-900' : 'theme-dark bg-[#0e0c0a] text-stone-100'} flex flex-col font-sans transition-colors duration-200`}>
          {/* Top Navigation Bar - ONLY VISIBLE IN SIMULATOR / DEMO MODE */}
          {(role === 'simulator' || new URLSearchParams(window.location.search).get('demo') === 'true') && (
            <nav className={`px-3 sm:px-4 py-2.5 sticky top-0 z-50 shadow-md border-b transition-colors ${theme === 'light' ? 'bg-white/95 border-stone-200 text-stone-900' : 'bg-[#161311] border-amber-900/30 text-white'}`}>
              <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="font-black text-sm flex items-center gap-1.5">
                    <span>🇦🇺</span>
                    <span><span className="text-amber-500 font-extrabold">SmartMenu</span> Australia ($ AUD)</span>
                  </span>
                  <span className="text-[10px] bg-stone-200 text-stone-800 font-mono font-black px-2 py-0.5 rounded-full uppercase">
                    Staff Hub
                  </span>
                </div>

                {/* Top View Selector & Cashier PIN Quick Button */}
                <div className="flex flex-wrap items-center gap-2">
                  {/* ☀️ / 🌙 Theme Toggle Button */}
                  <button
                    type="button"
                    onClick={toggleTheme}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black transition-all shadow-sm border cursor-pointer active:scale-95 ${
                      theme === 'light'
                        ? 'bg-amber-100 hover:bg-amber-200 text-amber-950 border-amber-300'
                        : 'bg-stone-800 hover:bg-stone-700 text-amber-300 border-stone-700'
                    }`}
                    title="Switch between Clean Light Cafe Theme & Night Lounge Dark Theme"
                  >
                    <span>{theme === 'light' ? '☀️ Light Mode' : '🌙 Dark Mode'}</span>
                  </button>

                  {/* 🔢 Dedicated Cashier PIN Pay Button (Always Visible) */}
                  <button
                    onClick={handleOpenCashierPin}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-black transition-all shadow active:scale-95 cursor-pointer border ${
                      pendingCount > 0
                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 border-amber-300 animate-pulse ring-2 ring-amber-500/50'
                        : (theme === 'light' ? 'bg-amber-50 hover:bg-amber-100 text-amber-900 border-amber-300' : 'bg-amber-950/70 hover:bg-amber-900 text-amber-300 border-amber-500/50')
                    }`}
                    title="Click to enter customer 4-digit PIN and verify counter payment"
                  >
                    <span className="text-base">🔢</span>
                    <span>Cashier PIN & Pay</span>
                    {pendingCount > 0 && (
                      <span className="bg-stone-950 text-amber-300 text-[10px] font-black px-2 py-0.5 rounded-full border border-amber-400">
                        {pendingCount} waiting
                      </span>
                    )}
                  </button>

                  <div className={`flex items-center gap-1 p-1 rounded-2xl border transition-colors ${theme === 'light' ? 'bg-stone-100 border-stone-200' : 'bg-[#100e0c] border-stone-800'}`}>
                    <button
                      onClick={() => setRole('master')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black transition-all ${
                        role === 'master'
                          ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg'
                          : (theme === 'light' ? 'text-amber-800 hover:text-amber-950 bg-amber-100/70 hover:bg-amber-200' : 'text-amber-300 hover:text-white bg-[#221a14] hover:bg-[#2e221a]')
                      }`}
                      title="Master Reseller & Multi-Venue Control Center"
                    >
                      <span>👑 Master Portal</span>
                    </button>

                    <button
                      onClick={() => setRole('admin')}
                      className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-black transition-all ${
                        role === 'admin'
                          ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg'
                          : (theme === 'light' ? 'text-stone-700 hover:text-black hover:bg-stone-200' : 'text-stone-300 hover:text-white bg-[#1e1916] hover:bg-[#28221e]')
                      }`}
                    >
                      <span>⚙️ Admin Panel</span>
                    </button>

                    <button
                      onClick={() => setRole('customer')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                        role === 'customer'
                          ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg font-black'
                          : (theme === 'light' ? 'text-stone-600 hover:text-black' : 'text-stone-400 hover:text-white')
                      }`}
                    >
                      <span>📱 Customer Menu</span>
                    </button>

                    <button
                      onClick={() => setRole('kitchen')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                        role === 'kitchen'
                          ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg font-black'
                          : (theme === 'light' ? 'text-stone-600 hover:text-black' : 'text-stone-400 hover:text-white')
                      }`}
                    >
                      <span>👨‍🍳 Kitchen KDS</span>
                    </button>

                    <a
                      href="promo.html"
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black transition-all bg-gradient-to-r from-amber-500/20 to-orange-500/20 text-amber-500 hover:text-amber-600 border border-amber-500/40 hover:bg-amber-500/30 shadow-sm"
                      title="Watch 30-Second Commercial & Interactive Video Demo"
                    >
                      <span>🎬 Video Spot</span>
                    </a>

                    <button
                      onClick={() => setRole('simulator')}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                        role === 'simulator'
                          ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 shadow-lg font-black'
                          : (theme === 'light' ? 'text-stone-600 hover:text-black' : 'text-stone-400 hover:text-white')
                      }`}
                    >
                      <span>⚡ Dual Screen</span>
                    </button>
                  </div>
                </div>
              </div>
            </nav>
          )}

          <div className="flex-1">
            {role === 'customer' && <CustomerViewAU />}
            {role === 'kitchen' && <KitchenDisplayAU />}
            {role === 'master' && <MasterResellerDashboardAU />}
            {role === 'admin' && <AdminDashboardAU />}
            {role === 'simulator' && (
              <div className="p-4 grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                <div className="xl:col-span-5 flex flex-col items-center">
                  <span className="text-xs font-bold text-slate-400 mb-2">📱 Customer Phone (Australia $ AUD)</span>
                  <div className="w-full max-w-[390px] h-[780px] bg-slate-950 border-[5px] border-slate-800 rounded-[40px] shadow-2xl overflow-y-auto hide-scrollbar"><CustomerViewAU /></div>
                </div>
                <div className="xl:col-span-7 flex flex-col">
                  <span className="text-xs font-bold text-slate-400 mb-2">👨‍🍳 Kitchen & Bar Display (KDS)</span>
                  <div className="bg-slate-900/60 border border-slate-800 rounded-3xl min-h-[780px]"><KitchenDisplayAU /></div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      return (
        <OrderProviderAU>
          <AppContent />
        </OrderProviderAU>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
